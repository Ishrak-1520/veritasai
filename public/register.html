<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeritasAI — Register</title>
  <meta name="description" content="Create a VeritasAI account to start detecting AI-generated media.">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="/index.html" class="logo">VERITAS<span>AI</span></a>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/scan.html">Analyze</a>
    <a href="/benchmark.html">Benchmark</a>
    <a href="/history.html" class="nav-authed hidden">History</a>
    <a href="/login.html" class="nav-guest">Login</a>
    <a href="/register.html" class="nav-guest btn-nav">Register</a>
    <button id="logoutBtn" class="nav-authed hidden btn-nav">Logout</button>
  </div>
</nav>

<div class="main-content">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="subtitle">Start detecting AI-generated media</p>
    <div class="form-group">
      <label for="email">Email</label>
      <input class="input-field" type="email" id="email"
             placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input class="input-field" type="password" id="password"
             placeholder="Min 8 characters" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="confirmPassword">Confirm Password</label>
      <input class="input-field" type="password" id="confirmPassword"
             placeholder="Repeat password" autocomplete="new-password">
    </div>
    <div id="registerError" class="error-message hidden"></div>
    <button class="btn-primary" id="registerBtn"
            style="width:100%; margin-top:8px">Create Account</button>
    <div class="form-footer" style="margin-top:16px">
      Already have an account?
      <a href="/login.html">Sign in &rarr;</a>
    </div>
  </div>
</div>

<script src="/js/utils.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  document.body.classList.add('loaded');
  initNav();
  if (isLoggedIn()) { window.location.href = '/index.html'; return; }

  document.getElementById('registerBtn').addEventListener('click', async function () {
    var email = document.getElementById('email').value.trim();
    var password = document.getElementById('password').value;
    var confirmPassword = document.getElementById('confirmPassword').value;
    hideError('registerError');

    if (!email || !password || !confirmPassword) {
      showError('registerError', 'All fields are required.');
      return;
    }
    if (password.length < 8) {
      showError('registerError', 'Password must be at least 8 characters.');
      return;
    }
    if (password !== confirmPassword) {
      showError('registerError', 'Passwords do not match.');
      return;
    }

    try {
      var res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      var data = await res.json();
      if (res.ok) {
        saveAuth(data.token, data.userId);
        window.location.href = '/index.html';
      } else {
        showError('registerError', data.error || 'Registration failed.');
      }
    } catch (e) {
      showError('registerError', 'Network error. Please try again.');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') document.getElementById('registerBtn').click();
  });
});
</script>
</body>
</html>
